[build-system]
requires = ["setuptools>=68", "Cython"]
build-backend = "setuptools.build_meta"


[project]
name = "luna"
version = "0.0.1"
description = "Lunar pit segmentation with Mask R-CNN on LPA/Wagner ellipse labels"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "requests>=2.32",
    "pvl>=1.3",
    "spiceypy>=6.0",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "torch>=2.3",
    "torchvision>=0.18",
    "pycocotools>=2.0.7",
    "rasterio>=1.3",
    "shapely>=2.0",
    "matplotlib>=3.8.0",
    "transformers>=4.40",
    "torchmetrics>=1.9.0",
    "termcolor>=3.3.0",
    "peft>=0.10.0",
    "rich>=13.0.0",
    "psutil>=5.9.0",
    "pandas>=2.0.0",
    "huggingface-hub>=0.20.0",
    "scikit-learn>=1.3.0",
    "numba>=0.59.0",
    "umap-learn>=0.5.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pydeps>=1.12.0",
    "vulture>=2.11",
]
dashboard = [
    "dash>=2.14.0",
    "datashader>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["luna", "luna.*"]

[tool.setuptools.package-data]
luna = [
    "../third_party/pithos/*.dylib",
    "../third_party/pithos/*.so",
    "py.typed",
]

[tool.pytest.ini_options]
testpaths = ["luna/tests"]