[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.0.1"
description = "Planetary photogrammetry, PDS data access, and vision models for lunar surface analysis"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["lunar", "lroc", "photogrammetry", "spice", "nasa-pds", "planetary-science", "vision-transformer", "dino"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies: Pure photogrammetry and PDS I/O with zero heavy ML overhead
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "Pillow>=9.0",
    "tqdm>=4.64",
    "requests>=2.28",
    "pvl>=1.3",
    "spiceypy>=5.0",
]

[project.optional-dependencies]
# Deep Learning & Vision Models (DINOv3, LoRA, Stage-2 Decoders)
ml = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "huggingface-hub>=0.20.0",
    "torchmetrics>=1.2.0",
    "opencv-python-headless>=4.8.0",
    "pycocotools>=2.0.7",
    "termcolor>=2.3.0",
    "rich>=13.0.0",
]

# High-throughput candidate screening & ring buffer engine
screening = [
    "psutil>=5.9.0",
]

# Geospatial & Vector Operations
geo = [
    "shapely>=2.0",
    "pyproj>=3.5",
    "rasterio>=1.3",
]

# Manifold Learning & Feature Space Topology
analysis = [
    "umap-learn>=0.5.5",
    "scikit-learn>=1.3.0",
    "numba>=0.58.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]

# Interactive Latent Space Dashboard
dashboard = [
    "dash>=2.14.0",
    "datashader>=0.16.0",
    "pandas>=2.0.0",
]

# All optional features bundled
all = [
    "luna[ml]",
    "luna[screening]",
    "luna[geo]",
    "luna[analysis]",
    "luna[dashboard]",
]

# Development, Testing, Linting & Documentation
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7.0",
]

docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.7.0",
]

[project.scripts]
luna-verify-physics = "luna.easter_egg.verify_physics:main"
luna-render-tufte = "luna.easter_egg.render_tufte:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["luna", "luna.*"]

[tool.setuptools.package-data]
luna = [
    "py.typed",
    "easter_egg/data/*",
]

[tool.pytest.ini_options]
testpaths = ["luna/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]