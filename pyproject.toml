[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.0.1"
description = "Lunar pit segmentation with Mask R-CNN on LPA/Wagner ellipse labels"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.0",
    "tqdm>=4.66",
    "requests>=2.32",
    "pvl>=1.3",
    "spiceypy>=6.0",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "torch>=2.3",
    "torchvision>=0.18",
    "pycocotools>=2.0.7",
    "rasterio>=1.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Phase 5 of the GPU projection plan: fused Triton kernel for ground_to_image.
# Linux/aarch64 + CUDA only — Spark (GB10) qualifies; macOS does not.
gpu = [
    "triton>=3.0; platform_system == 'Linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
]

[tool.setuptools.packages.find]
include = ["luna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires CUDA device (skipped on CPU-only hosts)",
    "spice: requires SPICE kernels under data/spice/lro (skipped if absent)",
]
